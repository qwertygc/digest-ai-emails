name: build-xpi

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire la version du manifeste
        id: ver
        run: |
          echo "version=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Construire le .xpi
        run: |
          mkdir -p dist
          zip -q -r -X dist/digest-ai-tb.xpi \
            manifest.json digest-lib.js background.js \
            popup.html popup.js options.html options.js \
            digest.html digest.js
          unzip -l dist/digest-ai-tb.xpi

      # Chaque commit sur main met à jour la release roulante « latest »
      - name: Release « latest »
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Build v${{ steps.ver.outputs.version }} (latest)"
          body: |
            Build automatique du commit ${{ github.sha }}.

            Installation : Thunderbird → Outils → Modules et thèmes → ⚙ →
            Installer un module depuis un fichier → sélectionner le .xpi.
          files: dist/*.xpi
          make_latest: true

      # Un tag vX.Y.Z crée une release versionnée définitive
      - name: Release versionnée (tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Digest IA v${{ steps.ver.outputs.version }}"
          body: |
            Release v${{ steps.ver.outputs.version }} du projet digest-ai-emails.

            Installation : Thunderbird → Outils → Modules et thèmes → ⚙ →
            Installer un module depuis un fichier → sélectionner le .xpi.
          files: dist/*.xpi

      # Flux de mise à jour automatique de Thunderbird (update.json) :
      # chaque version livrée y est ajoutée, le fichier est committé
      # avec [skip ci] pour ne pas relancer le workflow en boucle.
      - name: Mettre à jour update.json (mise à jour automatique)
        if: github.ref == 'refs/heads/main'
        run: |
          VER="${{ steps.ver.outputs.version }}"
          URL="https://github.com/${{ github.repository }}/releases/download/latest/digest-ai-tb.xpi"
          python3 - "$VER" "$URL" <<'PY'
          import json, sys
          ver, url = sys.argv[1], sys.argv[2]
          ID = 'digest-ai-emails@qwertygc'
          try:
              data = json.load(open('update.json'))
          except Exception:
              data = {}
          addon = data.setdefault('addons', {}).setdefault(ID, {'updates': []})
          updates = addon.setdefault('updates', [])
          if not any(u.get('version') == ver for u in updates):
              updates.append({'version': ver, 'update_link': url})
          with open('update.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write('\n')
          print('update.json prêt pour', ver)
          PY
          if git status --porcelain update.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add update.json
            git commit -m "update.json : v${VER} [skip ci]"
            git push
            echo "update.json mis à jour et poussé"
          else
            echo "update.json déjà à jour"
          fi
